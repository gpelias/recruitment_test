server:
  port: ${PORT}

spring:
  application:
    name: recruitment_test

  main:
    allow-bean-definition-overriding: true

  threads:
    virtual:
      enabled: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
          bands:
            url: ${BANDS_URL}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
  timelimiter:
    configs:
      default:
        timeout-duration: 5s