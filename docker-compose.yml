services:
  dws-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dws-bands-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - TZ=America/Sao_Paulo
      - BANDS_URL=https://bands-api.vercel.app/api
    restart: unless-stopped